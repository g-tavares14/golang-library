name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOOSE_VERSION: v3.29.0

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres descartável para os testes de integração (repository e ponta a ponta).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d golang_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=postgres password=postgres dbname=golang_test sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Instalar o golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Formatação
        run: golangci-lint fmt --diff ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir migrations postgres "$TEST_DATABASE_URL" up

      # Com TEST_DATABASE_URL definida e CI=true, um teste de banco pulado vira falha.
      - name: Testes
        run: go test -count=1 ./...
